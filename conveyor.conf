include required("/stdlib/jdk/17/openjdk.conf")

# JavaFX is linked into the runtime image from the official jmods for EACH
# target platform. Do NOT add the Maven JavaFX jars (target/lib/javafx-*.jar)
# to the inputs: those are built for the machine that ran Maven (Windows) and
# shipping them to Linux is what broke the Linux build (no libglass.so etc.).
include required("/stdlib/jvm/javafx/from-jmods.conf")
javafx.version = 21.0.6

app {
  # Build for Windows and Linux
  machines = [ windows.amd64, linux.amd64.glibc ]

  display-name = "LAN-Caster"
  rdns-name = "com.github.001albin.lancaster"
  vcs-url = "https://github.com/001Albin/LAN-Caster"
  version = "1.1.0"

  # Only the application jar; JavaFX comes from the jmods above.
  inputs += "target/LAN-Caster-1.0-SNAPSHOT.jar"

  icons = "icons/logo.png"

  jvm {
    gui.main-class = "org.develop.lancaster.Main"
    modules += javafx.controls
  }

  site {
    base-url = "https://001albin.github.io/LAN-Caster/"
    consistency-checks = warn
  }
}

conveyor.compatibility-level = 17
